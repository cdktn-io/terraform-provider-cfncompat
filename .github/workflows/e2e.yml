# On-demand end-to-end (terratest) suite for the cfncompat provider. Not run
# on push/PR -- see integ/README.md for what these tests do and why they are
# kept out of the default test.yml run.
name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      run_aws:
        description: >-
          Also run TestE2ECustomResource against real AWS (deploys an S3
          bucket, IAM role, and Lambda function). Requires the
          AWS_E2E_ROLE_ARN repository variable to be set to an IAM role ARN
          that trusts this repo's GitHub OIDC provider.
        type: boolean
        default: false

permissions:
  contents: read

# Manual dispatches shouldn't pile up concurrently -- TestE2ECustomResource
# creates real AWS resources, so avoid overlapping runs stepping on each
# other's stage-skip working state.
concurrency:
  group: e2e-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  functions-e2e:
    name: TestE2EFunctions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Run TestE2EFunctions
        working-directory: integ
        run: go test -v -count 1 -timeout 15m -run '^TestE2EFunctions$' ./...

  custom-resource-e2e:
    name: TestE2ECustomResource
    if: ${{ inputs.run_aws }}
    needs: functions-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required by aws-actions/configure-aws-credentials to mint short-lived
      # credentials via OIDC (no long-lived AWS secrets stored in GitHub).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_E2E_ROLE_ARN }}
          aws-region: us-east-1
      - name: Run TestE2ECustomResource
        working-directory: integ
        env:
          CFNCOMPAT_E2E_AWS: "1"
        run: go test -v -count 1 -timeout 30m -run '^TestE2ECustomResource$' ./...
